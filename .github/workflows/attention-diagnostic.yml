name: Attention diagnostic

on:
  push:
    branches: [justinchuby-attention-correctness-fixes]

jobs:
  attention:
    runs-on: macos-15
    env:
      ORT_VERSION: "1.31.0"
      ONNXRUNTIME_EP_MLX_CLAIM_DEBUG: "1"
      ONNXRUNTIME_EP_MLX_VERBOSE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: ./.github/actions/setup-mlx
        with:
          mlx-version: "0.32.2"
          mlx-commit: "1f8e74e3f12f31365464a6867c6579f0e9b29d85"
          mlxc-commit: "c74db5307cc8ce122f48d97ef951b30578674e7f"
      - name: Toolchain and runtime
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
          curl -fsSL "https://github.com/microsoft/onnxruntime/releases/download/v${ORT_VERSION}/onnxruntime-osx-arm64-${ORT_VERSION}.tgz" | tar xz
          echo "ORT_HOME=$PWD/onnxruntime-osx-arm64-${ORT_VERSION}" >> "$GITHUB_ENV"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Build provider
        run: ORT_INCLUDE_DIR="$ORT_HOME/include" RUSTFLAGS="-D warnings" cargo build --manifest-path rust/Cargo.toml --release
      - name: Exact public fixture diagnostics
        run: |
          python -m pip install "onnx==1.23.2" "onnxruntime==${ORT_VERSION}" numpy onnx_ir pytest
          export ONNXRUNTIME_MLX_EP_LIB="$PWD/rust/target/release/libonnxruntime_mlx_ep.dylib"
          export DYLD_LIBRARY_PATH="$ORT_HOME/lib"
          python tests/attention_diagnostic.py
