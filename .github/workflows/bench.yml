name: Bench

# Manual comparison of the selected ref and main. Shared-runner timings are too
# noisy for automatic regression signals; results stay in the Actions summary.
on:
  workflow_dispatch:

permissions:
  contents: read

# ONNX Runtime telemetry is deliberately NOT disabled here. It stays off on developer
# machines (rootdir conftest.py) and on in CI, so ORT's maintainers still see the runtime
# being used. If a job flakes on exit 134 with a green test summary, that is ORT's telemetry
# worker aborting at teardown -- set ORT_DISABLE_TELEMETRY: "1" on the affected job or step
# rather than debugging the PR under test.
jobs:
  bench:
    name: Op benchmark (macOS arm64)
    runs-on: macos-15
    env:
      ORT_VERSION: "1.31.0"
      ORT_BUILD_VERSION: "1.29.0"
      MLX_VERSION: "0.32.2"
      MLX_COMMIT: "1f8e74e3f12f31365464a6867c6579f0e9b29d85"
      MLXC_COMMIT: "c74db5307cc8ce122f48d97ef951b30578674e7f"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # need main to build the comparison dylib

      - name: Check base runtime ABI compatibility
        id: base-abi
        run: |
          base_sha="origin/main"
          echo "sha=$base_sha" >> "$GITHUB_OUTPUT"
          base_api="$(git show "$base_sha:rust/src/factory.rs" | sed -n 's/^pub const ORT_API_VERSION: u32 = \([0-9]*\);/\1/p')"
          pr_api="$(sed -n 's/^pub const ORT_API_VERSION: u32 = \([0-9]*\);/\1/p' rust/src/factory.rs)"
          if [ -n "$pr_api" ] && [ "$base_api" = "$pr_api" ] && \
             git show "$base_sha:rust/src/engine.rs" | grep -q "mlx_cumsum_axis"; then
            echo "compatible=true" >> "$GITHUB_OUTPUT"
          else
            echo "compatible=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: ./.github/actions/setup-mlx
        with:
          mlx-version: ${{ env.MLX_VERSION }}
          mlx-commit: ${{ env.MLX_COMMIT }}
          mlxc-commit: ${{ env.MLXC_COMMIT }}

      - name: Install Rust toolchain (rustup — no third-party action, supply-chain hardening)
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable

      - name: Provision ONNX Runtime ${{ env.ORT_VERSION }}
        run: |
          set -euo pipefail
          for version in "$ORT_BUILD_VERSION" "$ORT_VERSION"; do
            if [ ! -d "onnxruntime-osx-arm64-$version" ]; then
              curl -fsSL \
                "https://github.com/microsoft/onnxruntime/releases/download/v${version}/onnxruntime-osx-arm64-${version}.tgz" \
                | tar xz
            fi
          done
          echo "ORT_HOME=$PWD/onnxruntime-osx-arm64-${ORT_VERSION}" >> "$GITHUB_ENV"
          echo "ORT_BUILD_HOME=$PWD/onnxruntime-osx-arm64-${ORT_BUILD_VERSION}" >> "$GITHUB_ENV"

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Python deps
        run: python -m pip install --upgrade "onnxruntime==${ORT_VERSION}" numpy onnx onnx_ir

      - name: Build selected ref EP dylib
        run: |
          set -euo pipefail
          ( cd rust && ORT_INCLUDE_DIR="$ORT_BUILD_HOME/include" cargo build --release )
          cp rust/target/release/libonnxruntime_mlx_ep.dylib "$RUNNER_TEMP/pr.dylib"

      - name: Build base (main) EP dylib in a worktree
        if: steps.base-abi.outputs.compatible == 'true'
        run: |
          set -euo pipefail
          BASE_SHA="${{ steps.base-abi.outputs.sha }}"
          git worktree add "$RUNNER_TEMP/base" "$BASE_SHA"
          ( cd "$RUNNER_TEMP/base/rust" && ORT_INCLUDE_DIR="$ORT_BUILD_HOME/include" cargo build --release )
          cp "$RUNNER_TEMP/base/rust/target/release/libonnxruntime_mlx_ep.dylib" "$RUNNER_TEMP/base.dylib"

      - name: Run benchmark (selected ref harness against both dylibs)
        run: |
          set -euo pipefail
          export DYLD_LIBRARY_PATH="$ORT_HOME/lib"
          if [ "${{ steps.base-abi.outputs.compatible }}" = "true" ]; then
            # Use the same harness and cases even if the selected ref changed the case set.
            ONNXRUNTIME_MLX_EP_LIB="$RUNNER_TEMP/base.dylib" python bench/bench.py --out base.json --label "base (main)"
          fi
          ONNXRUNTIME_MLX_EP_LIB="$RUNNER_TEMP/pr.dylib" python bench/bench.py --out pr.json --label "selected ref"

      - name: Build comparison report
        run: |
          if [ "${{ steps.base-abi.outputs.compatible }}" = "true" ]; then
            python bench/compare.py --base base.json --pr pr.json --threshold 10 > comment.md
          else
            {
              echo "## MLX EP op benchmark"
              echo
              echo "The selected ref benchmark completed, but the base comparison was skipped because the base does not satisfy the ABI compatibility checks."
            } > comment.md
          fi
          cat comment.md >> "$GITHUB_STEP_SUMMARY"
